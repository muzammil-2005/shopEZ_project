version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: shopez_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
    container_name: shopez_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/shopez_db
      - JWT_SECRET=shopez_super_secret_jwt_key_2026_production_ready
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
    container_name: shopez_client
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mongo_data:
